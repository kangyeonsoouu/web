<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡</title>
    <link rel="stylesheet" href="./css/reset.css">
    <style>
        body{margin: 50;}
        h2{text-align: center; font-size: 24px; font-weight: 700;
        padding-top: 50px;}
        form{
            border: 5px solid antiquewhite;
            width: 700px;
            margin: 50px auto;
            padding: 30px;
        }
        legend{display: none;}
        li{border-bottom: 1px solid antiquewhite; padding: 10px 0;}
        li label{display: inline-block; width: 78px;}
        li input{width: 87%;padding: 8px 5px; box-sizing: border-box;}
        #d-day{width: 30%;}
        small{position: relative; top: 10px;left: 5px; font-size: 12px;}
        div{text-align: center; margin-top: 40px;}
        div input{border: none; background-color: antiquewhite; color: rgb(14, 14, 14); padding: 10px 20px;}
        h3{text-align: center; margin-top: 20px; margin-bottom: 20px;}
        .button li{border-bottom: none; float: left;}
        .button li label{width: 20px;}
        .button li input{width: 35px;}
        .button :after {clear: both; content:""; display: block;}
        #checkbutton label{width: 173px;}
    </style>
</head>
<body>
    <h2>배송정보</h2>
    <form action="#">
        <fieldset>
            <legend>배송정보</legend>
            <ul id="shipping">
                <li>
                    <label for="prod">주문상품</label>
                    <input type="text" id="prod" value="상품용 3kg" readonly>
                </li>
                <li>
                    <label for="userName">이름</label>
                    <input type="text"  id="userName" autofocus required>
                </li>
                <li>
                    <label for="addr">배송주소</label>
                    <input type="text" id="addr" required>
                </li>
                <li>
                    <label for="mail">이메일</label>
                    <input type="text" id="mail">
                <li>
                    <label for="phone">연락처</label>
                    <input type="tel" id="phone" placeholder="하이픈 빼고 입력해주세요(01012345678)" required>
                </li>
                <li>
                    <label for="d-day">배송지정</label>
                    <input type="date" id="d-day"> <small>(주문일로부터 최소 3일 이후)</small>
                </li>
                <li>
                    <label for="path">가입경로</label>
                    <select name="path" id="path">
                          <option value="blog">블로그</option>
                          <option value="search">인터넷 검색</option>
                          <option value="sns">sns</option>
                          <option value="etc">기타</option>
                        </select>
                </li>
                <li>
                    <label for="memo">메모</label>
                    <textarea name="memo" id="memo" maxlength="500" cols="40" row="4">남길 말씀이 있다면 여기에..

                    </textarea>
                </li>
            </ul>
        </fieldset>
       
        <fieldset>
            <legend>이벤트와 새로운 소식</legend>
            <h3>이벤트와 새로운 소식</h3>
            <ul id="radiobutton " class="button">
                <li>
                    <input type="radio" id="mailok" name="mail"  checked>
                    <label for="mailok"> 메일 수신</label>
                </li>
                <li>
                    <input type="radio" id="mailoff" name="mail">
                    <label for="mailoff"> 메일 수신 안함</label>
                </li>

                <h3>개인 정보 수집 약관</h3>
                <ul id="checkbutton" class="button">
                    <li>
                        <input type="checkbox" id="a" name="mail"  checked>
                        <label for="a"> 이용약관</label>
                    </li>
                    <li>
                        <input type="checkbox" id="b" name="mail">
                        <label for="b"> 개인 정보 수집 이용</label>
                    </li>
                    <li>
                        <input type="checkbox" id="c" name="mail">
                        <label for="c"> 위치 기반 서비스 이용약관</label>
                    </li>
            </ul>
        </fieldset>
        <hr>
        <div>
            <input type="submit" value="주문하기">
            <input type="reset" value="취소하기">
        </div>
    </form>
    
</body>
</html>
