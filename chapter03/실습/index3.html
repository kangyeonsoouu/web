<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인페이지</title>
    <style>
        #form1 {width: 400px; height: 200px; margin: 20px auto;}
        #form1 fieldset{border: 5px solid #ddd;}
        #form1 legend{display: none;}
        #form1 label{ width: 65px; display: inline-block;}
        #form1 input{ width: 248px; padding: 10px 20px;}
        #form1 #submit{width: 100%;background-color: rgb(68, 56, 233); color: #ddd; border-radius: 5px;}

     
    </style>
</head>
<body>
    <form action="#" id="form1">
       <fieldset>
        <legend>로그인</legend>
        <p>
            <label for="username">이름</label>
            <input type="text" id="username" placeholder="이름을 입력해주세요">
        </p>
        <p>
            <label for="userpwd">비밀번호</label>
            <input type="password" id="userpwd" placeholder="비밀번호를 입력해주세요">
        </p>
        <p>
            <input type="submit" value="로그인" id="submit">
        </p>
       </fieldset>

    </form>

</html>
