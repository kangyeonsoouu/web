<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼태그</title>

</head>
<body>
    <form action="#" method="post" name="" id="">
        <fieldset>
            <legend>폼요소</legend>
           <p>
                <label for="text1">이름</label>
                <input type="text" id="text1" placeholder="이름을 작성해주세요">
           </p>
            <p>
                <label>비밀번호 <input type="password" placeholder="비밀번호를 입력해주세요"></label>
            </p>

            <div><input type="search" placeholder="검색어를 입력하세요"></div>
            <div><input type="url" placeholder="url을 입력하세요"></div>
            <div>
                <label for="usertel">연락처</label>
                <input type="tel" id="usertel" >
            </div>
            <div>
                <label for="usernum">수량</label>
                <input type="number" id="usernum" >
            </div>
            <div>
                <input type="range">
            </div>
            <div>
                <input type="date">
            </div>
                <input type="submit">
                <div>
                    <input type="submit" value="전송">
                    <input type="reset">
                    <input type="image" src="./images/login.gif">
                    <input type="button" value="전송">
                    <input type="file">
                    <input type="hidden">
                </div>


        </fieldset>
    </form>

</body>
</html>
