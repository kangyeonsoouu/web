<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습해보기</title>
    <style>
        *{margin:0; padding: 0;}
        h1{text-align: center; padding: 10px; color: rgb(222, 156, 216);}
        li{text-align: center;}
        ul{padding: 50px;}
        body{text-align: center;}
        a{color: blueviolet; font-weight: 600; font-size: 22px;}
        h2{margin: 50px 0; background-color: blue;}
    </style>
</head>
<body>
    <h1 id="위로위로" style="background-color: bisque;">네임앵커 이용하기</h1>
    <hr>
    <ul>
        <li><a href="#toy1" style="background-color: bisque;">Toy1</a></li>
        <li><a href="#toy2">Toy2</a></li>
        <li><a href="#toy3">Toy3</a></li>
    </ul>
    <hr>
    <h2 id="toy1">회전 동물 알파벳</h2>
    <img src="./images/toy1.jpg" alt="회전동물">
    <hr>

    <h2 id="toy2">애벌레</h2>
    <img src="./images/toy2.jpg" alt="애벌레">
    <hr>

    <h2 id="toy3">스스로 움직이는 공</h2>
    <img src="./images/toy3.jpg" alt="스스로 움직이는 공">
    <hr>

    <p><a href="#위로위로">위로 올라가기</a></p>
    <p>이전에 배운 내용 하나 더 정리해보자면 선택했을 때 거기로 가게 하려고 h2를 쓸 수 없다 왜냐하면 h2가 중복되기 때문에 , 그래서 id를 각각 정해주고 href뒤에
        #을 쓰고 각각의 id를 넣으면 거기로 이동가능함 
    </p>
</body>
</html>
